[project]
name = "insightxi-ai-service"
version = "0.0.0"
description = "InsightXI AI service — explainable football prediction models"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "scikit-learn>=1.5.1",
    "xgboost>=2.1.0",
    "pandas>=2.2.2",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "httpx>=0.27.0",
    "ruff>=0.5.1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
