[project]
name = "insightxi-ai-service"
version = "0.0.0"
description = "InsightXI AI service — explainable football prediction models"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "scikit-learn>=1.5.1",
    "xgboost>=2.1.0",
    "pandas>=2.2.2",
    "numpy>=2.0.0",
    # Direct runtime use: (de)serializing trained model artifacts in
    # app.models.ml_ensemble and app.training.train.
    "joblib>=1.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "httpx>=0.27.0",
    "ruff>=0.5.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Only the importable service code is a package; top-level models/, datasets/,
# training artifacts etc. are output/data dirs, not Python packages.
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
