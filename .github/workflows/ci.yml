name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    name: Web + API (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version is pinned via the root package.json "packageManager" field
      # (pnpm@9.12.0). Passing `version` here too makes action-setup@v4 fail with
      # "Multiple versions of pnpm specified", so we let it read packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck API
        run: pnpm --filter @insightxi/api exec tsc --noEmit
      - name: Test API
        run: pnpm --filter @insightxi/api test
      - name: Lint web
        run: pnpm --filter @insightxi/web lint
      - name: Test web
        run: pnpm --filter @insightxi/web test
      - name: Build web
        run: pnpm --filter @insightxi/web build

  ai:
    name: AI Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Typecheck E2E
        run: pnpm exec tsc --noEmit -p tsconfig.e2e.json
      - name: Run E2E (offline mock backend)
        run: pnpm test:e2e
