name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    name: Web + API (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck API
        run: pnpm --filter @insightxi/api exec tsc --noEmit
      - name: Test API
        run: pnpm --filter @insightxi/api test
      - name: Lint web
        run: pnpm --filter @insightxi/web lint
      - name: Build web
        run: pnpm --filter @insightxi/web build

  ai:
    name: AI Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
