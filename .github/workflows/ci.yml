name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    name: Web + API (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version is pinned via the root package.json "packageManager" field
      # (pnpm@9.12.0). Passing `version` here too makes action-setup@v4 fail with
      # "Multiple versions of pnpm specified", so we let it read packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck API
        run: pnpm --filter @insightxi/api exec tsc --noEmit
      - name: Test API
        run: pnpm --filter @insightxi/api test
      - name: Lint web
        run: pnpm --filter @insightxi/web lint
      - name: Test web
        run: pnpm --filter @insightxi/web test
      - name: Build web
        run: pnpm --filter @insightxi/web build

  ai:
    name: AI Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Typecheck E2E
        run: pnpm exec tsc --noEmit -p tsconfig.e2e.json
      - name: Run E2E (offline mock backend)
        run: pnpm test:e2e

  lighthouse:
    name: Lighthouse (perf budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build API (served from dist for the audit)
        run: pnpm --filter @insightxi/api build
      - name: Build web (production bundles)
        run: pnpm --filter @insightxi/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          # Serve via `next start` (not the standalone bundle) for the audit.
          NEXT_DISABLE_STANDALONE: "true"
      # @lhci/cli is run via dlx so it never touches the workspace lockfile.
      # ubuntu-latest ships Google Chrome, which chrome-launcher auto-detects.
      - name: Run Lighthouse CI (enforces the JS bundle budget)
        run: pnpm dlx @lhci/cli@0.14.x autorun
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore

  postgres-smoke:
    name: Postgres smoke (DATA_BACKEND=postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insightxi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/insightxi
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Apply the schema with psql (preinstalled on ubuntu-latest) before the
      # API boots — it seeds the demo users on startup and needs the tables.
      - name: Apply schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f apps/api/src/db/schema.sql
      - name: Build API
        run: pnpm --filter @insightxi/api build
      - name: Start API against Postgres
        run: node apps/api/dist/main.js &
        env:
          DATA_BACKEND: postgres
          API_PORT: "4000"
          JWT_SECRET: ci-postgres-smoke-secret
          RATE_LIMIT_ENABLED: "false"
      - name: Run Postgres smoke test
        run: node scripts/pg-smoke.mjs
