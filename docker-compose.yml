# Local full-stack run: Postgres + Redis + AI + API + Web.
# Mirrors the production topology so the live (postgres) backend and queues
# can be exercised end-to-end without cloud services.
#
#   docker compose up --build
#
# Then: web http://localhost:3000, api http://localhost:4000, ai http://localhost:8000
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: insightxi
      POSTGRES_PASSWORD: insightxi
      POSTGRES_DB: insightxi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightxi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai:
    build:
      context: ./apps/ai-service
    ports:
      - "8000:8000"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: 4000
      DATA_BACKEND: postgres
      DATABASE_URL: postgresql://insightxi:insightxi@postgres:5432/insightxi
      REDIS_URL: redis://redis:6379
      ENABLE_QUEUES: "true"
      AI_SERVICE_URL: http://ai:8000
      JWT_SECRET: dev-secret-change-me
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
